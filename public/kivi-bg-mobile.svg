<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 932" width="430" height="932">
  <defs>
    <!-- Main gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" style="stop-color:#c8e8d4;stop-opacity:1"/>
      <stop offset="40%" style="stop-color:#d4edd8;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#f0e0b8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f0d090;stop-opacity:1"/>
    </linearGradient>

    <!-- Warm top light -->
    <radialGradient id="topLight" cx="50%" cy="0%" r="60%">
      <stop offset="0%" style="stop-color:#e8f5e8;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#c8e8d4;stop-opacity:0"/>
    </radialGradient>

    <!-- Warm bottom glow -->
    <radialGradient id="bottomGlow" cx="50%" cy="100%" r="55%">
      <stop offset="0%" style="stop-color:#f5d890;stop-opacity:0.55"/>
      <stop offset="100%" style="stop-color:#f0d090;stop-opacity:0"/>
    </radialGradient>

    <!-- Window light from top-right -->
    <radialGradient id="windowGlow" cx="90%" cy="25%" r="45%">
      <stop offset="0%" style="stop-color:#fff8e8;stop-opacity:0.55"/>
      <stop offset="100%" style="stop-color:#f0e0b8;stop-opacity:0"/>
    </radialGradient>

    <filter id="softShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2d5a3d" flood-opacity="0.15"/>
    </filter>

    <filter id="plantShadow">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#1a3d28" flood-opacity="0.18"/>
    </filter>

    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="55%" style="stop-color:transparent;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#1a3820;stop-opacity:0.2"/>
    </radialGradient>
  </defs>

  <!-- BASE BACKGROUND -->
  <rect width="430" height="932" fill="url(#bgGrad)"/>
  <rect width="430" height="932" fill="url(#topLight)"/>
  <rect width="430" height="932" fill="url(#bottomGlow)"/>
  <rect width="430" height="932" fill="url(#windowGlow)"/>

  <!-- ===== WALL / FLOOR DIVISION ===== -->
  <line x1="0" y1="700" x2="430" y2="700" stroke="#c8a870" stroke-width="1" opacity="0.25"/>
  <rect x="0" y="700" width="430" height="232" fill="#e8c890" opacity="0.2"/>

  <!-- Floor planks -->
  <g opacity="0.1" stroke="#8b6030" stroke-width="1">
    <line x1="0" y1="720" x2="430" y2="720"/>
    <line x1="0" y1="745" x2="430" y2="745"/>
    <line x1="0" y1="770" x2="430" y2="770"/>
    <line x1="0" y1="800" x2="430" y2="800"/>
    <line x1="0" y1="830" x2="430" y2="830"/>
    <line x1="0" y1="860" x2="430" y2="860"/>
    <line x1="0" y1="895" x2="430" y2="895"/>
    <line x1="80" y1="700" x2="72" y2="932"/>
    <line x1="200" y1="700" x2="192" y2="932"/>
    <line x1="330" y1="700" x2="322" y2="932"/>
  </g>

  <!-- ===== WINDOW (TOP RIGHT) ===== -->
  <!-- Window frame -->
  <rect x="260" y="60" width="155" height="200" rx="8" fill="#f5f0e8" opacity="0.85" filter="url(#softShadow)"/>
  <!-- Sky -->
  <rect x="268" y="68" width="139" height="88" rx="5" fill="#a8d8e8" opacity="0.6"/>
  <!-- Ground/garden -->
  <rect x="268" y="156" width="139" height="96" rx="0" fill="#b8d890" opacity="0.55"/>
  <!-- Clouds -->
  <ellipse cx="300" cy="90" rx="25" ry="11" fill="white" opacity="0.7"/>
  <ellipse cx="318" cy="83" rx="18" ry="13" fill="white" opacity="0.7"/>
  <ellipse cx="360" cy="95" rx="20" ry="9" fill="white" opacity="0.6"/>
  <!-- Trees outside -->
  <ellipse cx="280" cy="165" rx="18" ry="28" fill="#5a9a4a" opacity="0.55"/>
  <ellipse cx="370" cy="168" rx="20" ry="25" fill="#4a8a3a" opacity="0.5"/>
  <ellipse cx="400" cy="172" rx="15" ry="22" fill="#5a9a4a" opacity="0.45"/>
  <!-- Frame bars -->
  <rect x="268" y="68" width="139" height="184" rx="5" fill="none" stroke="#d4c8a0" stroke-width="8" opacity="0.8"/>
  <line x1="337" y1="68" x2="337" y2="252" stroke="#d4c8a0" stroke-width="5" opacity="0.8"/>
  <line x1="268" y1="156" x2="407" y2="156" stroke="#d4c8a0" stroke-width="5" opacity="0.8"/>
  <!-- Sill -->
  <rect x="252" y="258" width="168" height="14" rx="4" fill="#e8d8a8" opacity="0.85"/>

  <!-- ===== DESK ===== -->
  <rect x="0" y="650" width="430" height="58" rx="5" fill="#c8a870" opacity="0.7" filter="url(#softShadow)"/>
  <rect x="0" y="648" width="430" height="14" rx="3" fill="#d8b880" opacity="0.85"/>
  <!-- Table legs -->
  <rect x="20" y="704" width="16" height="90" rx="4" fill="#b09060" opacity="0.6"/>
  <rect x="394" y="704" width="16" height="90" rx="4" fill="#b09060" opacity="0.6"/>

  <!-- ===== LAPTOP ===== -->
  <g filter="url(#softShadow)">
    <!-- Screen -->
    <rect x="130" y="555" width="200" height="128" rx="10" fill="#2d2d2d" opacity="0.9"/>
    <rect x="138" y="563" width="184" height="112" rx="6" fill="#1a3d28" opacity="0.95"/>
    <rect x="138" y="563" width="184" height="112" rx="6" fill="#3a7a50" opacity="0.25"/>
    <!-- Screen UI elements -->
    <rect x="150" y="575" width="70" height="7" rx="3" fill="#7ac890" opacity="0.7"/>
    <rect x="150" y="588" width="110" height="5" rx="2" fill="#5ab070" opacity="0.5"/>
    <rect x="150" y="599" width="85" height="5" rx="2" fill="#5ab070" opacity="0.4"/>
    <circle cx="280" cy="590" r="16" fill="#e8841a" opacity="0.8"/>
    <text x="280" y="596" text-anchor="middle" font-size="14" fill="white" opacity="0.9">$</text>
    <rect x="150" y="618" width="160" height="1" rx="1" fill="#7ac890" opacity="0.3"/>
    <rect x="150" y="628" width="55" height="6" rx="3" fill="#e8a030" opacity="0.6"/>
    <rect x="215" y="628" width="45" height="6" rx="3" fill="#5ab070" opacity="0.6"/>
    <!-- Keyboard base -->
    <rect x="118" y="681" width="224" height="12" rx="6" fill="#3d3d3d" opacity="0.9"/>
  </g>

  <!-- ===== PHONE (beside laptop) ===== -->
  <g filter="url(#softShadow)">
    <rect x="360" y="603" width="44" height="76" rx="7" fill="#2d2d2d" opacity="0.9"/>
    <rect x="365" y="609" width="34" height="62" rx="5" fill="#3a7a50" opacity="0.9"/>
    <rect x="368" y="614" width="28" height="4" rx="2" fill="#7ac890" opacity="0.6"/>
    <rect x="368" y="621" width="20" height="3" rx="2" fill="#e8a030" opacity="0.6"/>
    <circle cx="382" cy="638" r="11" fill="#e8841a" opacity="0.7"/>
    <text x="382" y="643" text-anchor="middle" font-size="10" fill="white" opacity="0.9">✓</text>
    <circle cx="382" cy="611" r="2" fill="#555" opacity="0.6"/>
  </g>

  <!-- ===== FRUIT BASKET ===== -->
  <g transform="translate(18, 580)">
    <!-- Basket -->
    <ellipse cx="52" cy="82" rx="44" ry="13" fill="#c89050" opacity="0.65"/>
    <rect x="10" y="48" width="84" height="36" rx="9" fill="#c89050" opacity="0.6"/>
    <rect x="8" y="46" width="88" height="10" rx="4" fill="#d4a060" opacity="0.75"/>
    <!-- Weave lines -->
    <g stroke="#a87040" stroke-width="1" opacity="0.4">
      <line x1="18" y1="48" x2="13" y2="84"/>
      <line x1="33" y1="48" x2="28" y2="84"/>
      <line x1="52" y1="48" x2="52" y2="84"/>
      <line x1="71" y1="48" x2="76" y2="84"/>
      <line x1="86" y1="48" x2="91" y2="84"/>
      <line x1="10" y1="62" x2="94" y2="62"/>
      <line x1="10" y1="72" x2="94" y2="72"/>
    </g>
    <!-- Fruits -->
    <circle cx="28" cy="40" r="15" fill="#f07030" opacity="0.88"/>
    <line x1="28" y1="27" x2="30" y2="22" stroke="#3d7a2a" stroke-width="2"/>
    <circle cx="52" cy="34" r="13" fill="#f0c030" opacity="0.88"/>
    <line x1="52" y1="23" x2="54" y2="18" stroke="#3d7a2a" stroke-width="2"/>
    <circle cx="74" cy="41" r="12" fill="#e04030" opacity="0.82"/>
    <ellipse cx="77" cy="30" rx="4" ry="2.5" fill="#4a8a2a" opacity="0.8" transform="rotate(-20, 77, 30)"/>
  </g>

  <!-- ===== COFFEE MUG ===== -->
  <g transform="translate(352, 610)" filter="url(#softShadow)" opacity="0">
    <!-- Hidden - phone takes this space on mobile -->
  </g>

  <!-- Mug - placed left of laptop -->
  <g transform="translate(72, 616)" filter="url(#softShadow)">
    <ellipse cx="26" cy="60" rx="22" ry="7" fill="#8a5a30" opacity="0.35"/>
    <rect x="5" y="18" width="42" height="44" rx="7" fill="#f5f0e8" opacity="0.88"/>
    <rect x="5" y="18" width="42" height="12" rx="5" fill="#e8e0d0" opacity="0.8"/>
    <path d="M47,26 Q62,26 62,42 Q62,58 47,56" stroke="#e8e0d0" stroke-width="5" fill="none" opacity="0.85"/>
    <!-- Steam lines -->
    <path d="M15,16 Q17,8 15,2" stroke="#d0c0a0" stroke-width="1.5" fill="none" opacity="0.45" stroke-linecap="round"/>
    <path d="M26,13 Q28,5 26,-2" stroke="#d0c0a0" stroke-width="1.5" fill="none" opacity="0.45" stroke-linecap="round"/>
    <path d="M37,16 Q39,8 37,2" stroke="#d0c0a0" stroke-width="1.5" fill="none" opacity="0.45" stroke-linecap="round"/>
    <rect x="10" y="30" width="30" height="3" rx="1.5" fill="#3d7a2a" opacity="0.35"/>
  </g>

  <!-- ===== NOTEPAD ===== -->
  <g transform="translate(18, 650)" opacity="0.8">
    <!-- Slightly under desk edge / beside basket -->
  </g>

  <!-- ===== BIG PLANT LEFT ===== -->
  <g transform="translate(-15, 380)" filter="url(#plantShadow)">
    <!-- Pot -->
    <ellipse cx="60" cy="295" rx="48" ry="13" fill="#c87840" opacity="0.65"/>
    <rect x="15" y="258" width="90" height="40" rx="8" fill="#c87840" opacity="0.7"/>
    <rect x="12" y="254" width="96" height="12" rx="5" fill="#d88848" opacity="0.75"/>
    <!-- Stems -->
    <path d="M60,252 C58,225 38,195 15,145" stroke="#3d7a2a" stroke-width="4" fill="none" opacity="0.8"/>
    <path d="M60,252 C64,215 82,178 100,120" stroke="#3d7a2a" stroke-width="4" fill="none" opacity="0.8"/>
    <path d="M60,252 C55,230 48,205 52,170" stroke="#3d7a2a" stroke-width="3" fill="none" opacity="0.65"/>
    <path d="M60,252 C66,228 74,208 70,175" stroke="#3d7a2a" stroke-width="3" fill="none" opacity="0.65"/>
    <!-- Leaves -->
    <ellipse cx="15" cy="140" rx="28" ry="12" fill="#4a9a3a" opacity="0.85" transform="rotate(-30, 15, 140)"/>
    <ellipse cx="102" cy="114" rx="30" ry="13" fill="#4a9a3a" opacity="0.82" transform="rotate(25, 102, 114)"/>
    <ellipse cx="50" cy="163" rx="22" ry="9" fill="#5aaa4a" opacity="0.78" transform="rotate(-15, 50, 163)"/>
    <ellipse cx="73" cy="170" rx="22" ry="9" fill="#5aaa4a" opacity="0.78" transform="rotate(18, 73, 170)"/>
    <ellipse cx="25" cy="105" rx="32" ry="14" fill="#3d8a2e" opacity="0.7" transform="rotate(-38, 25, 105)"/>
    <ellipse cx="90" cy="98" rx="32" ry="13" fill="#3d8a2e" opacity="0.7" transform="rotate(38, 90, 98)"/>
  </g>

  <!-- ===== SMALL HANGING SHELF ===== -->
  <rect x="240" y="420" width="170" height="12" rx="3" fill="#c8a870" opacity="0.55" filter="url(#softShadow)"/>
  <rect x="248" y="420" width="6" height="30" rx="2" fill="#b09060" opacity="0.45"/>
  <rect x="396" y="420" width="6" height="30" rx="2" fill="#b09060" opacity="0.45"/>
  <!-- Small pot on shelf -->
  <g transform="translate(275, 385)">
    <ellipse cx="18" cy="37" rx="16" ry="5" fill="#c87840" opacity="0.6"/>
    <rect x="3" y="22" width="30" height="17" rx="5" fill="#c87840" opacity="0.65"/>
    <rect x="1" y="20" width="34" height="6" rx="3" fill="#d88848" opacity="0.7"/>
    <ellipse cx="18" cy="14" rx="12" ry="13" fill="#5aaa4a" opacity="0.82"/>
    <ellipse cx="18" cy="8" rx="7" ry="9" fill="#4a9a3a" opacity="0.75"/>
  </g>
  <g transform="translate(330, 388)">
    <ellipse cx="16" cy="33" rx="14" ry="4" fill="#c87840" opacity="0.55"/>
    <rect x="3" y="20" width="26" height="15" rx="4" fill="#c87840" opacity="0.6"/>
    <rect x="1" y="18" width="30" height="5" rx="2" fill="#d88848" opacity="0.65"/>
    <circle cx="16" cy="12" r="10" fill="#e8601a" opacity="0.7"/>
    <ellipse cx="16" cy="4" rx="5" ry="2.5" fill="#4a9a3a" opacity="0.8" transform="rotate(8, 16, 4)"/>
  </g>

  <!-- ===== AMBIENT DECORATIVE ELEMENTS ===== -->
  <!-- Soft organic circles for depth -->
  <circle cx="215" cy="300" r="200" fill="#a8d8b8" opacity="0.06"/>
  <circle cx="380" cy="600" r="140" fill="#e8b050" opacity="0.07"/>
  <circle cx="50" cy="750" r="160" fill="#b8d8a0" opacity="0.07"/>
  <circle cx="380" cy="100" r="100" fill="#f0d070" opacity="0.06"/>

  <!-- Decorative dots top-right -->
  <g opacity="0.13" fill="#3d7a2a">
    <circle cx="405" cy="30" r="2.5"/>
    <circle cx="418" cy="48" r="2"/>
    <circle cx="392" cy="50" r="2"/>
    <circle cx="422" cy="30" r="1.5"/>
    <circle cx="410" cy="64" r="1.5"/>
  </g>

  <!-- Decorative dots bottom left -->
  <g opacity="0.11" fill="#e8841a">
    <circle cx="15" cy="888" r="3.5"/>
    <circle cx="35" cy="906" r="2.5"/>
    <circle cx="10" cy="915" r="2"/>
    <circle cx="50" cy="900" r="2"/>
    <circle cx="28" cy="922" r="2.5"/>
  </g>

  <!-- ===== VIGNETTE ===== -->
  <rect width="430" height="932" fill="url(#vignette)"/>

</svg>
